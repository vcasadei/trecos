# Only dependencies approved in openspec/changes/trecos-v1 (proposal Impact, design D21)
# belong here. Add an entry when a task first needs it.

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
navigation = "2.10.2"
room = "2.8.5"
ksp = "2.3.12"
sqlcipher = "4.19.1"
sqlite = "2.7.1"
datastore = "1.2.1"
lifecycle = "2.11.0"
work = "2.12.0"
