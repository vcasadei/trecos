# Robolectric needs Java 21 for its Android 36 sandbox; the project builds on JDK 17.
# Rendering and resources in these tests do not depend on the target SDK.
sdk=35
application=app.trecos.TestTrecosApplication
# Native graphics for every test: realistic text measurement everywhere, and the
# native runtime loads before anything else can open the archives it needs
# (otherwise migration tests running first break it with FileSystemAlreadyExistsException).
graphicsMode=NATIVE
