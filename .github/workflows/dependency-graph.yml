# Submits the app's runtime dependencies, including transitive ones, to
# GitHub's dependency graph so Dependabot alerts cover every library that
# ships in Trecos. Build-tool classpaths (Gradle plugins) are left out: they
# never reach users and Dependabot can't update them. GitHub can't read Gradle
# version catalogs on its own. Alerts track the default branch, so this runs
# on pushes to master.
name: Dependency graph

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    name: Submit Gradle dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/dependency-submission@v6
        env:
          DEPENDENCY_GRAPH_INCLUDE_CONFIGURATIONS: .*RuntimeClasspath
