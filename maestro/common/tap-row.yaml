# Scrolls the list until the row with test tag ID sits in the middle of the
# screen, then taps it. Centring keeps the row clear of the floating bottom bar,
# which otherwise catches taps on rows at the bottom edge. A row near the end
# of the list can't be centred; then the plain scroll brings it into view and
# the list's bottom padding keeps it above the bar. Use tap.yaml for buttons
# fixed to the bottom of a form.
appId: app.trecos
---
- scrollUntilVisible:
    element:
      id: ${ID}
    direction: DOWN
    timeout: 10000
    centerElement: true
    optional: true
- scrollUntilVisible:
    element:
      id: ${ID}
    direction: DOWN
    timeout: 10000
- tapOn:
    id: ${ID}
