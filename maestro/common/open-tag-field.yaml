# Opens a new item form in the current place, names the item NAME and focuses its tag field.
appId: app.trecos
---
- tapOn:
    id: add_button
- tapOn: Item
- tapOn:
    id: field_name
- inputText: ${NAME}
- runFlow:
    file: tap.yaml
    env:
      ID: more_fields
# The form can still be moving while the keyboard opens, and then the tap misses
# and the name field keeps the focus, so tap until the tag field has it.
- repeat:
    while:
      notVisible:
        id: field_tag
        focused: true
    times: 3
    commands:
      - scrollUntilVisible:
          element:
            id: field_tag
      - tapOn:
          id: field_tag
