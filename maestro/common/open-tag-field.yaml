# Opens a new item form in the current place, names the item NAME and focuses its tag field.
appId: app.trecos
---
- tapOn:
    id: add_button
- tapOn: Item
- tapOn:
    id: field_name
- inputText: ${NAME}
- runFlow:
    file: tap.yaml
    env:
      ID: more_fields
# Compose reports the full bounds of a field only partly scrolled into view, so
# Maestro counts it as visible and its centre can be on the Save bar: centre it
# when it can be (see tap.yaml).
# A tap can still miss while the form moves (category suggestions load after
# the name), and the name field keeps the focus, so tap until the tag field has it.
- repeat:
    while:
      notVisible:
        id: field_tag
        focused: true
    times: 3
    commands:
      - scrollUntilVisible:
          element:
            id: field_tag
          timeout: 5000
          centerElement: true
          optional: true
      - scrollUntilVisible:
          element:
            id: field_tag
      - tapOn:
          id: field_tag
