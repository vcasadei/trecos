# Opens a new item form in the current place, names the item NAME and focuses its tag field.
appId: app.trecos
---
- tapOn:
    id: add_button
- tapOn: Item
- tapOn:
    id: field_name
- inputText: ${NAME}
- runFlow:
    file: tap.yaml
    env:
      ID: more_fields
# Maestro counts the field as visible even when the floating Save bar covers
# its lower half, and its centre is then under the bar: centre it on screen.
# A tap can still miss while the form moves (category suggestions load after
# the name), and the name field keeps the focus, so tap until the tag field has it.
- repeat:
    while:
      notVisible:
        id: field_tag
        focused: true
    times: 3
    commands:
      - scrollUntilVisible:
          element:
            id: field_tag
          centerElement: true
      - tapOn:
          id: field_tag
