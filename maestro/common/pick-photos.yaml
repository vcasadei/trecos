# Picks gallery photos at positions FIRST and, when set, SECOND, then confirms
# when the picker asks for it. Where the system photo picker is installed: with
# one slot left it may return on the first tap, otherwise it needs "Done", or
# "Add (N)" on the Android 12 to 15 picker.
# Android 9 and 10, and the Android 11 emulator image, show the Files app
# instead (pick-in-files.yaml), where each photo is picked by name, one at a time.
# The app keeps each image once, so pick different positions each time.
appId: app.trecos
---
- runFlow:
    when:
      visible: Show roots
    commands:
      - runFlow:
          file: pick-in-files.yaml
          env:
            PHOTO: ${Number(FIRST) + 1}
      # One photo at a time: Android 11's Files app doesn't start a selection on a
      # long press, so the second photo comes from opening the picker again.
      - runFlow:
          when:
            true: ${typeof SECOND !== 'undefined' && SECOND !== ''}
          commands:
            - tapOn:
                id: add_photo
            - runFlow:
                when:
                  visible: Add a photo from
                commands:
                  - tapOn: Gallery
            - runFlow:
                file: pick-in-files.yaml
                env:
                  PHOTO: ${Number(SECOND) + 1}
- runFlow:
    when:
      notVisible: Show roots
    commands:
      - runFlow:
          when:
            visible: Photo taken on.*
          commands:
            - tapOn:
                text: Photo taken on.*
                index: ${FIRST}
            - runFlow:
                when:
                  true: ${typeof SECOND !== 'undefined' && SECOND !== ''}
                commands:
                  - tapOn:
                      text: Photo taken on.*
                      index: ${SECOND}
            - tapOn:
                text: (?i)(done|add)( \(\d+\))?
                optional: true
