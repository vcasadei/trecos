# Picks gallery photos at positions FIRST and, when set, SECOND, then confirms
# when the picker asks for it. Where the system photo picker is installed: with
# one slot left it may return on the first tap, otherwise it needs "Done", or
# "Add (N)" on the Android 12 to 15 picker.
# Android 9 and 10, and the Android 11 emulator image, show the Files app, in
# Downloads, where photos are picked by name (photo-N.png, N = position + 1;
# the grid view adds the size and time after a comma): one tap returns a single
# photo, and several need a long press, another tap and, except on Android 11,
# "Select". The app keeps each image once, so pick different positions each time.
appId: app.trecos
---
- runFlow:
    when:
      visible: Show roots
    commands:
      # It reopens where it was last; go back to Downloads first.
      - tapOn: Show roots
      # The drawer entry, below Recent; the title also reads "Downloads" only
      # when the picker reopens there.
      - tapOn:
          text: Downloads
          below: Recent
      - scrollUntilVisible:
          element:
            text: photo-${Number(FIRST) + 1}\.png(,.*)?
      - runFlow:
          when:
            true: ${typeof SECOND === 'undefined' || SECOND === ''}
          commands:
            - tapOn: photo-${Number(FIRST) + 1}\.png(,.*)?
      - runFlow:
          when:
            true: ${typeof SECOND !== 'undefined' && SECOND !== ''}
          commands:
            - longPressOn: photo-${Number(FIRST) + 1}\.png(,.*)?
            - scrollUntilVisible:
                element:
                  text: photo-${Number(SECOND) + 1}\.png(,.*)?
            - tapOn: photo-${Number(SECOND) + 1}\.png(,.*)?
            # Android 11's Files app can return both photos on that tap.
            - tapOn:
                text: (?i)select|open
                optional: true
- runFlow:
    when:
      notVisible: Show roots
    commands:
      - runFlow:
          when:
            visible: Photo taken on.*
          commands:
            - tapOn:
                text: Photo taken on.*
                index: ${FIRST}
            - runFlow:
                when:
                  true: ${typeof SECOND !== 'undefined' && SECOND !== ''}
                commands:
                  - tapOn:
                      text: Photo taken on.*
                      index: ${SECOND}
            - tapOn:
                text: (?i)(done|add)( \(\d+\))?
                optional: true
