# Starts the app from a cleared state, seeded with the fixture in FIXTURE
# (one-house, two-houses, photos, 1000-items; anything else starts empty).
appId: app.trecos
---
# A slow emulator's launcher or System UI can stop responding; its dialog then
# covers the app for every later flow unless someone answers it.
- runFlow:
    when:
      visible: .*isn.t responding
    commands:
      - tapOn: Wait
- launchApp:
    clearState: true
    stopApp: true
    arguments:
      fixture: ${FIXTURE}
# A slow Android 14 can remove the previous screen only after this launch and
# kill the new process with it; the app then comes back about 20 seconds later.
# Wait for its first screen (the first-run prompt or the tabs) for that long.
- extendedWaitUntil:
    visible:
      id: continue|tab_.*
    timeout: 45000
    optional: true
