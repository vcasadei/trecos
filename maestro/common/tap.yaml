# Scrolls until the control with test tag ID is on screen, centred, then taps it.
# Forms are taller than small screens, so their buttons can start below the fold;
# centring keeps the control clear of the floating bottom bar.
appId: app.trecos
---
- scrollUntilVisible:
    element:
      id: ${ID}
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: ${ID}
